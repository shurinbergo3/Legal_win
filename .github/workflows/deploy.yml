name: Build & Deploy

# Собираем Docker-образ на железе GitHub (не на проде) и триггерим редеплой в Dokploy
on:
  push:
    branches: [main]
  workflow_dispatch: {} # позволяет запустить вручную из вкладки Actions
  schedule:
    # Ежедневный ребилд в 06:15 UTC публикует отложенные посты блога: date-gate
    # в src/lib/blog.ts показывает статьи, чья publishDate уже наступила. Так
    # запланированные материалы выходят по одному в день без ручных пушей.
    - cron: '15 6 * * *'

env:
  IMAGE: ghcr.io/shurinbergo3/legal_win

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # нужно, чтобы пушить образ в ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история нужна, чтобы посчитать реальные даты последнего
          # изменения секций для sitemap <lastmod> (git log по путям).
          fetch-depth: 0

      - name: Compute sitemap lastmod dates from git history
        id: lastmod
        run: |
          SERVICES=$(git log -1 --format=%cI -- src/lib/services src/components/ServiceDetail.tsx)
          LEGAL=$(git log -1 --format=%cI -- src/lib/legal-content.ts src/components/LegalPage.tsx)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "legal=$LEGAL" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "Services lastmod: $SERVICES"
          echo "Legal lastmod:    $LEGAL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SERVICES_LAST_MODIFIED=${{ steps.lastmod.outputs.services }}
            LEGAL_LAST_MODIFIED=${{ steps.lastmod.outputs.legal }}
            BUILD_DATE=${{ steps.lastmod.outputs.build_date }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        run: curl -fsS -X GET "${{ secrets.DOKPLOY_WEBHOOK }}"

      # IndexNow нельзя запускать на этапе build (внутри Docker нет ни ключа,
      # ни задеплоенного сайта). Запускаем после редеплоя против живого
      # sitemap.xml — скрипт сам отфильтрует свежие URL по <lastmod>.
      - name: Wait for Dokploy to redeploy
        run: sleep 90

      - name: Submit fresh URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/notify-indexnow.mjs

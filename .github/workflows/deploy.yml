name: Build & Deploy

# Собираем Docker-образ на железе GitHub (не на проде) и триггерим редеплой в Dokploy
on:
  push:
    branches: [main]
  workflow_dispatch: {} # позволяет запустить вручную из вкладки Actions

env:
  IMAGE: ghcr.io/shurinbergo3/legal_win

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # нужно, чтобы пушить образ в ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        run: curl -fsS -X GET "${{ secrets.DOKPLOY_WEBHOOK }}"

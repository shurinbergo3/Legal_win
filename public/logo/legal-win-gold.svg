<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="800" height="800">
  <!-- LegalWin "Layered Monogram" — gold L + cream W + Themis halo -->

  <!-- THEMIS SCALES (background, opacity 0.28 for legibility) -->
  <g opacity="0.28" stroke="#B8923A" fill="#B8923A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 156 22 L 160 16 L 164 22 L 160 28 Z" stroke="none"/>
    <line x1="160" y1="26" x2="160" y2="200" stroke-width="2.0" fill="none"/>
    <path d="M 50 76 Q 160 68 270 76" stroke-width="3.2" fill="none"/>
    <path d="M 156 72 L 160 64 L 164 72 L 160 80 Z" stroke="none"/>
    <circle cx="50" cy="76" r="3.5" stroke="none"/>
    <circle cx="270" cy="76" r="3.5" stroke="none"/>
    <line x1="50" y1="76" x2="32" y2="100" stroke-width="1.8" fill="none"/>
    <line x1="50" y1="76" x2="50" y2="100" stroke-width="1.8" fill="none"/>
    <line x1="50" y1="76" x2="68" y2="100" stroke-width="1.8" fill="none"/>
    <line x1="270" y1="76" x2="252" y2="100" stroke-width="1.8" fill="none"/>
    <line x1="270" y1="76" x2="270" y2="100" stroke-width="1.8" fill="none"/>
    <line x1="270" y1="76" x2="288" y2="100" stroke-width="1.8" fill="none"/>
    <ellipse cx="50" cy="104" rx="25" ry="4.5" stroke-width="2.4" fill="none"/>
    <path d="M 25 105 Q 50 123 75 105" stroke-width="2.4" fill="none"/>
    <ellipse cx="270" cy="104" rx="25" ry="4.5" stroke-width="2.4" fill="none"/>
    <path d="M 245 105 Q 270 123 295 105" stroke-width="2.4" fill="none"/>
  </g>

  <!-- W — editorial, thin, flat caps, cream -->
  <path d="M 50 50 L 108 200 L 160 114 L 212 200 L 270 50"
        stroke="#f5f7fb" stroke-width="12" fill="none"
        stroke-linecap="butt" stroke-linejoin="miter"/>
  <!-- W serif accents -->
  <line x1="42" y1="50" x2="58" y2="50" stroke="#f5f7fb" stroke-width="5" stroke-linecap="butt"/>
  <line x1="262" y1="50" x2="278" y2="50" stroke="#f5f7fb" stroke-width="5" stroke-linecap="butt"/>
  <line x1="100" y1="200" x2="116" y2="200" stroke="#f5f7fb" stroke-width="5" stroke-linecap="butt"/>
  <line x1="204" y1="200" x2="220" y2="200" stroke="#f5f7fb" stroke-width="5" stroke-linecap="butt"/>

  <!-- L — editorial, flat caps, gold -->
  <path d="M 160 50 L 160 200 L 212 200"
        stroke="#B8923A" stroke-width="16" fill="none"
        stroke-linecap="butt" stroke-linejoin="miter"/>
  <!-- L serif accents -->
  <line x1="151" y1="50" x2="169" y2="50" stroke="#B8923A" stroke-width="6.5" stroke-linecap="butt"/>
  <line x1="212" y1="192" x2="212" y2="208" stroke="#B8923A" stroke-width="6.5" stroke-linecap="butt"/>

  <!-- Wordmark -->
  <text x="160" y="232" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond','Playfair Display',Georgia,serif"
        font-size="22" font-weight="500" fill="#B8923A" letter-spacing="5.4">LEGALWIN</text>

  <!-- Hairline divider -->
  <line x1="116" y1="252" x2="204" y2="252" stroke="#B8923A" stroke-width="0.6" opacity="0.45"/>

  <!-- Tagline -->
  <text x="160" y="270" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond',Georgia,serif"
        font-size="8.5" font-weight="500" fill="#B8923A" letter-spacing="4.2" opacity="0.62">WARSZAWA · POLSKA</text>
</svg>

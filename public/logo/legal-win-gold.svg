<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="800" height="800">
  <!-- LegalWin "Polish Bar" — gold on transparent -->

  <!-- Ł monogram — L-shape centered on canvas -->
  <rect x="128" y="22" width="22" height="156" fill="#B8923A"/>
  <rect x="128" y="156" width="64" height="22" fill="#B8923A"/>
  <line x1="108" y1="92" x2="170" y2="56"
        stroke="#B8923A" stroke-width="12" stroke-linecap="square"/>

  <!-- Wordmark -->
  <text x="160" y="232" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond','Playfair Display',Georgia,serif"
        font-size="22" font-weight="500" fill="#B8923A" letter-spacing="5.4">LEGALWIN</text>

  <!-- Hairline divider -->
  <line x1="116" y1="252" x2="204" y2="252"
        stroke="#B8923A" stroke-width="0.6" opacity="0.45"/>

  <!-- Tagline -->
  <text x="160" y="270" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond',Georgia,serif"
        font-size="8.5" font-weight="500" fill="#B8923A" letter-spacing="4.2" opacity="0.62">WARSZAWA · POLSKA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="800" height="800">
  <!-- LegalWin "Polish Bar" — ink on transparent -->

  <!-- Ł monogram — optically balanced -->
  <rect x="152" y="22" width="22" height="156" fill="#0a1021"/>
  <rect x="152" y="156" width="64" height="22" fill="#0a1021"/>
  <line x1="112" y1="124" x2="188" y2="50"
        stroke="#0a1021" stroke-width="12" stroke-linecap="square"/>

  <!-- Wordmark -->
  <text x="160" y="232" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond','Playfair Display',Georgia,serif"
        font-size="22" font-weight="500" fill="#0a1021" letter-spacing="5.4">LEGALWIN</text>

  <!-- Hairline divider -->
  <line x1="116" y1="252" x2="204" y2="252"
        stroke="#0a1021" stroke-width="0.6" opacity="0.45"/>

  <!-- Tagline -->
  <text x="160" y="270" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond',Georgia,serif"
        font-size="8.5" font-weight="500" fill="#0a1021" letter-spacing="4.2" opacity="0.62">WARSZAWA · POLSKA</text>
</svg>

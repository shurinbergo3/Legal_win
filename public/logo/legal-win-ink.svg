<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="800" height="800">
  <!-- LegalWin Sovereign Signet — ink on transparent (for letterheads on white surfaces) -->

  <!-- Outer ring -->
  <circle cx="160" cy="160" r="152" stroke="#0a1021" stroke-width="1.4" fill="none"/>
  <!-- Inner ghost ring -->
  <circle cx="160" cy="160" r="146" stroke="#0a1021" stroke-width="0.5" fill="none" opacity="0.45"/>

  <!-- Heraldic star + flanking ticks -->
  <path d="M160 16 L162.65 23.15 L170.3 23.15 L164.0 27.6 L166.4 35.05 L160 30.55 L153.6 35.05 L156.0 27.6 L149.7 23.15 L157.35 23.15 Z"
        fill="#0a1021" opacity="0.92"/>
  <line x1="132" y1="25" x2="142" y2="25" stroke="#0a1021" stroke-width="0.7" opacity="0.55"/>
  <line x1="178" y1="25" x2="188" y2="25" stroke="#0a1021" stroke-width="0.7" opacity="0.55"/>

  <!-- L -->
  <path d="M 104 80 L 104 184 L 152 184"
        stroke="#0a1021" stroke-width="13" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- W -->
  <path d="M 168 80 L 184 184 L 192 132 L 200 184 L 216 80"
        stroke="#0a1021" stroke-width="13" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Linking dot -->
  <circle cx="160" cy="184" r="2.2" fill="#0a1021"/>

  <!-- Engraved rule with diamond stops -->
  <line x1="92" y1="214" x2="228" y2="214" stroke="#0a1021" stroke-width="0.7" opacity="0.7"/>
  <path d="M88 214 L92 209 L96 214 L92 219 Z" fill="#0a1021" opacity="0.85"/>
  <path d="M224 214 L228 209 L232 214 L228 219 Z" fill="#0a1021" opacity="0.85"/>

  <!-- Wordmark: LEGAL ⋄ WIN -->
  <text x="151" y="244" text-anchor="end"
        font-family="'Fraunces','Cormorant Garamond','Playfair Display',Georgia,serif"
        font-size="16.5" font-weight="600" fill="#0a1021" letter-spacing="3.6">LEGAL</text>
  <path d="M155 238 L160 232 L165 238 L160 244 Z" fill="#0a1021"/>
  <text x="169" y="244" text-anchor="start"
        font-family="'Fraunces','Cormorant Garamond','Playfair Display',Georgia,serif"
        font-size="16.5" font-weight="600" fill="#0a1021" letter-spacing="3.6">WIN</text>

  <!-- Tagline -->
  <text x="160" y="266" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond',Georgia,serif"
        font-size="9" font-weight="500" fill="#0a1021" letter-spacing="4.8" opacity="0.62">WARSZAWA</text>
</svg>

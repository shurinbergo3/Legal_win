<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="800" height="800">
  <!-- LegalWin "Layered Monogram" — ink L + light-ink W + Themis halo (light surfaces) -->

  <!-- THEMIS SCALES (background, ghosted) -->
  <g opacity="0.18" stroke="#0a1021" fill="#0a1021" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 156 22 L 160 16 L 164 22 L 160 28 Z" stroke="none"/>
    <line x1="160" y1="26" x2="160" y2="200" stroke-width="1.6" fill="none"/>
    <path d="M 50 76 Q 160 68 270 76" stroke-width="2.2" fill="none"/>
    <path d="M 156 72 L 160 64 L 164 72 L 160 80 Z" stroke="none"/>
    <circle cx="50" cy="76" r="3" stroke="none"/>
    <circle cx="270" cy="76" r="3" stroke="none"/>
    <line x1="50" y1="76" x2="32" y2="100" stroke-width="1.2" fill="none"/>
    <line x1="50" y1="76" x2="50" y2="100" stroke-width="1.2" fill="none"/>
    <line x1="50" y1="76" x2="68" y2="100" stroke-width="1.2" fill="none"/>
    <line x1="270" y1="76" x2="252" y2="100" stroke-width="1.2" fill="none"/>
    <line x1="270" y1="76" x2="270" y2="100" stroke-width="1.2" fill="none"/>
    <line x1="270" y1="76" x2="288" y2="100" stroke-width="1.2" fill="none"/>
    <ellipse cx="50" cy="104" rx="22" ry="3.6" stroke-width="1.6" fill="none"/>
    <path d="M 28 105 Q 50 121 72 105" stroke-width="1.6" fill="none"/>
    <ellipse cx="270" cy="104" rx="22" ry="3.6" stroke-width="1.6" fill="none"/>
    <path d="M 248 105 Q 270 121 292 105" stroke-width="1.6" fill="none"/>
  </g>

  <!-- W — mid layer, mid-gray; frames the L on both sides -->
  <path d="M 50 50 L 105 196 L 160 110 L 215 196 L 270 50"
        stroke="#9aa6bd" stroke-width="17" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- L — front layer, ink; stem on W's central axis, foot meets W's right-bottom -->
  <path d="M 160 50 L 160 196 L 215 196"
        stroke="#0a1021" stroke-width="22" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="160" y="232" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond','Playfair Display',Georgia,serif"
        font-size="22" font-weight="500" fill="#0a1021" letter-spacing="5.4">LEGALWIN</text>

  <!-- Hairline divider -->
  <line x1="116" y1="252" x2="204" y2="252" stroke="#0a1021" stroke-width="0.6" opacity="0.45"/>

  <!-- Tagline -->
  <text x="160" y="270" text-anchor="middle"
        font-family="'Fraunces','Cormorant Garamond',Georgia,serif"
        font-size="8.5" font-weight="500" fill="#0a1021" letter-spacing="4.2" opacity="0.62">WARSZAWA · POLSKA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="favRim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F4DA84"/>
      <stop offset="22%" stop-color="#E1BC5E"/>
      <stop offset="50%" stop-color="#9A6F1E"/>
      <stop offset="78%" stop-color="#D9B358"/>
      <stop offset="100%" stop-color="#7E5710"/>
    </linearGradient>
    <linearGradient id="favText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D779"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8E6918"/>
    </linearGradient>
    <linearGradient id="favBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1a36"/>
      <stop offset="100%" stop-color="#05091a"/>
    </linearGradient>
  </defs>

  <!-- Outer gold rim -->
  <path d="M 50 24 L 270 24 Q 282 24 282 36 L 282 198 Q 282 250 160 292 Q 38 250 38 198 L 38 36 Q 38 24 50 24 Z"
        fill="url(#favRim)"/>

  <!-- Inner navy body -->
  <path d="M 58 34 L 262 34 Q 272 34 272 44 L 272 195 Q 272 244 160 281 Q 48 244 48 195 L 48 44 Q 48 34 58 34 Z"
        fill="url(#favBody)"/>

  <!-- Inner gold hairline -->
  <path d="M 64 40 L 256 40 Q 266 40 266 50 L 266 192 Q 266 238 160 273 Q 54 238 54 192 L 54 50 Q 54 40 64 40 Z"
        fill="none" stroke="url(#favRim)" stroke-width="0.9" opacity="0.85"/>

  <!-- Themis silhouette behind LW — same params as Logo.tsx Shield. Stays
       barely visible at favicon scale; reads as an embossed watermark on
       larger renderings of the shield. -->
  <g transform="translate(60 40) scale(0.83)"
     color="#c9a84c" stroke="currentColor" fill="none"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
     opacity="0.22">
    <circle cx="120" cy="22" r="4" fill="currentColor" stroke="none"/>
    <line x1="120" y1="26" x2="120" y2="38"/>
    <path d="M112 38 L128 38 L126 44 L114 44 Z"/>
    <line x1="120" y1="44" x2="120" y2="222"/>
    <line x1="38" y1="60" x2="202" y2="60"/>
    <circle cx="38" cy="60" r="2" fill="currentColor" stroke="none"/>
    <circle cx="202" cy="60" r="2" fill="currentColor" stroke="none"/>
    <line x1="38" y1="62" x2="22" y2="118"/>
    <line x1="38" y1="62" x2="54" y2="118"/>
    <line x1="202" y1="62" x2="186" y2="118"/>
    <line x1="202" y1="62" x2="218" y2="118"/>
    <path d="M14 118 L62 118"/>
    <path d="M14 118 Q38 148 62 118"/>
    <path d="M22 134 Q38 142 54 134" opacity="0.6"/>
    <path d="M178 118 L226 118"/>
    <path d="M178 118 Q202 148 226 118"/>
    <path d="M186 134 Q202 142 218 134" opacity="0.6"/>
    <line x1="120" y1="222" x2="120" y2="240"/>
    <path d="M92 240 L148 240"/>
    <path d="M82 252 L158 252"/>
    <path d="M76 262 L164 262"/>
  </g>

  <!-- LW monogram — same breathing room (fontSize/letterSpacing/y) as Logo.tsx Shield -->
  <text x="160" y="194" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="116" font-weight="700"
        fill="url(#favText)" letter-spacing="-2">LW</text>
</svg>

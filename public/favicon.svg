<svg xmlns="http://www.w3.org/2000/svg" viewBox="26 18 280 280">
  <defs>
    <linearGradient id="favRim" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#FBE7A0"/>
      <stop offset="22%" stop-color="#E9C770"/>
      <stop offset="50%" stop-color="#9F7320"/>
      <stop offset="78%" stop-color="#E2BB5E"/>
      <stop offset="100%" stop-color="#6F4A0C"/>
    </linearGradient>
    <linearGradient id="favBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#16264e"/>
      <stop offset="55%" stop-color="#0a1330"/>
      <stop offset="100%" stop-color="#03081a"/>
    </linearGradient>
    <linearGradient id="favText" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDEAA0"/>
      <stop offset="45%" stop-color="#E1BD60"/>
      <stop offset="75%" stop-color="#B68A2C"/>
      <stop offset="100%" stop-color="#7A5512"/>
    </linearGradient>
    <radialGradient id="favSheen" cx="32%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="favHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBE7A0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7A5512" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Outer gold rim of the shield -->
  <path d="M 50 24 L 270 24 Q 282 24 282 36 L 282 198 Q 282 250 160 292 Q 38 250 38 198 L 38 36 Q 38 24 50 24 Z"
        fill="url(#favRim)"/>

  <!-- Inner navy body -->
  <path d="M 58 34 L 262 34 Q 272 34 272 44 L 272 195 Q 272 244 160 281 Q 48 244 48 195 L 48 44 Q 48 34 58 34 Z"
        fill="url(#favBody)"/>

  <!-- Top-left luminous sheen on the navy body -->
  <path d="M 58 34 L 262 34 Q 272 34 272 44 L 272 195 Q 272 244 160 281 Q 48 244 48 195 L 48 44 Q 48 34 58 34 Z"
        fill="url(#favSheen)"/>

  <!-- Crisp inner gold hairline -->
  <path d="M 64 40 L 256 40 Q 266 40 266 50 L 266 192 Q 266 238 160 273 Q 54 238 54 192 L 54 50 Q 54 40 64 40 Z"
        fill="none" stroke="url(#favHair)" stroke-width="1.4" opacity="0.95"/>

  <!-- LW monogram — bold, optimized for 16/32px legibility -->
  <text x="160" y="206" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="138" font-weight="800"
        fill="url(#favText)" letter-spacing="-4">LW</text>

  <!-- Gold flourish line below the monogram -->
  <line x1="120" y1="232" x2="200" y2="232"
        stroke="url(#favRim)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="160" cy="232" r="2.6" fill="url(#favRim)"/>
</svg>

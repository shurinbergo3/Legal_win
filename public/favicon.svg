<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lw-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c269"/>
      <stop offset="1" stop-color="#b4862e"/>
    </linearGradient>
  </defs>

  <!-- Dark navy rounded background — keeps mark visible on any browser tab -->
  <rect width="64" height="64" rx="14" fill="#05091a"/>

  <!-- Scales of justice mark, scaled into the 64×64 frame -->
  <g
    transform="translate(16,12)"
    fill="none"
    stroke="url(#lw-gold)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Top finial -->
    <circle cx="16" cy="4" r="1.8" fill="url(#lw-gold)" stroke="none"/>
    <!-- Central pillar -->
    <line x1="16" y1="5.4" x2="16" y2="32"/>
    <!-- Crossbeam -->
    <line x1="3" y1="10" x2="29" y2="10"/>
    <!-- Suspension drops -->
    <line x1="5" y1="10" x2="5" y2="14.5"/>
    <line x1="27" y1="10" x2="27" y2="14.5"/>
    <!-- Left pan -->
    <path d="M0.5 14.5 L9.5 14.5 Q5 20 0.5 14.5 Z"/>
    <!-- Right pan -->
    <path d="M22.5 14.5 L31.5 14.5 Q27 20 22.5 14.5 Z"/>
    <!-- Tiered base -->
    <line x1="11" y1="32" x2="21" y2="32"/>
    <line x1="8.5" y1="35" x2="23.5" y2="35"/>
    <line x1="6" y1="38" x2="26" y2="38"/>
  </g>
</svg>

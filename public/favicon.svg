  <!-- Inner gold hairline -->
  <path d="M 64 40 L 256 40 Q 266 40 266 50 L 266 192 Q 266 238 160 273 Q 54 238 54 192 L 54 50 Q 54 40 64 40 Z"
        fill="none" stroke="url(#favRim)" stroke-width="0.9" opacity="0.85"/>

  <!-- LW monogram — same breathing room (fontSize/letterSpacing/y) as Logo.tsx Shield -->
  <text x="160" y="194" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="116" font-weight="700"
        fill="url(#favText)" letter-spacing="-2">LW</text>
</svg>

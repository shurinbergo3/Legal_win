<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Dark navy rounded chip — keeps mark visible on light or dark browser tabs -->
  <rect width="320" height="320" rx="56" fill="#05091a"/>

  <!-- W — wide, behind, frames the L on both sides -->
  <path d="M 40 70 L 100 250 L 160 140 L 220 250 L 280 70"
        stroke="#f5f7fb" stroke-width="22" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- L — front; stem on W's central axis, foot ends at W's right-bottom -->
  <path d="M 160 70 L 160 250 L 220 250"
        stroke="#D4A647" stroke-width="28" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

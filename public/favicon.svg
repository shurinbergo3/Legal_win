<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="favRim" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F4DA84"/>
      <stop offset="22%" stop-color="#E1BC5E"/>
      <stop offset="50%" stop-color="#9A6F1E"/>
      <stop offset="78%" stop-color="#D9B358"/>
      <stop offset="100%" stop-color="#7E5710"/>
    </linearGradient>
    <linearGradient id="favText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D779"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8E6918"/>
    </linearGradient>
    <linearGradient id="favBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1a36"/>
      <stop offset="100%" stop-color="#05091a"/>
    </linearGradient>
  </defs>

  <!-- Outer gold rim -->
  <path d="M 50 24 L 270 24 Q 282 24 282 36 L 282 198 Q 282 250 160 292 Q 38 250 38 198 L 38 36 Q 38 24 50 24 Z"

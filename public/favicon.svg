<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="fg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#F2E08A"/>
      <stop offset="30%"  stop-color="#C9A84C"/>
      <stop offset="55%"  stop-color="#9A6F1E"/>
      <stop offset="80%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6210"/>
    </linearGradient>
    <linearGradient id="ft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F0DC82"/>
      <stop offset="50%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07828"/>
    </linearGradient>
    <linearGradient id="fn" x1="0%" y1="0%" x2="100%" y2="120%">
      <stop offset="0%"   stop-color="#1E2E55"/>
      <stop offset="100%" stop-color="#09142A"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background chip -->
  <rect width="320" height="320" rx="60" fill="#05091a"/>

  <!-- Scale the shield to fit: translate to center, scale ~1.35 -->
  <g transform="translate(60 18) scale(1.0)">
    <!-- Outer gold rim (shield path in 200x268 coords, we show 200x228) -->
    <path d="M 28,12 L 172,12 Q 192,12 192,34 L 192,150 Q 192,202 100,236 Q 8,202 8,150 L 8,34 Q 8,12 28,12 Z"
          fill="url(#fg)"/>
    <!-- Navy body -->
    <path d="M 37,21 L 163,21 Q 181,21 181,41 L 181,148 Q 181,196 100,228 Q 19,196 19,148 L 19,41 Q 19,21 37,21 Z"
          fill="url(#fn)"/>
    <!-- Inner border -->
    <path d="M 45,29 L 155,29 Q 171,29 171,46 L 171,145 Q 171,189 100,220 Q 29,189 29,145 L 29,46 Q 29,29 45,29 Z"
          fill="none" stroke="url(#fg)" stroke-width="1.8"/>
    <!-- Corner diamonds -->
    <polygon points="45,29 51,35 45,41 39,35" fill="url(#fg)"/>
    <polygon points="155,29 161,35 155,41 149,35" fill="url(#fg)"/>
    <!-- LW monogram -->
    <text x="100" y="152"
          font-family="'Georgia','Times New Roman',Times,serif"
          font-size="84" font-weight="700"
          fill="url(#ft)" text-anchor="middle" letter-spacing="-3">LW</text>
  </g>
</svg>
